version: '3.8'

services:
  backend:
    build: ./QsrBackend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DB_DIALECT=postgres
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=qsr_db
      - JWT_SECRET=dev_secret
    depends_on:
      - db
    networks:
      - qsr-network

  frontend:
    build: ./QsrWebAdmin
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - qsr-network

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=qsr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qsr-network

networks:
  qsr-network:
    driver: bridge

volumes:
  postgres_data:
