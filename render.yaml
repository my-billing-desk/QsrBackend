services:
  - type: web
    name: qsr-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /data/database.sqlite
      - key: NODE_ENV
        value: production
